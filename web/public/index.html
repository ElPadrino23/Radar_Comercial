<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar Comercial - PPG</title>
</head>
<body>

  <!-- Login -->
  <section id="vista-login">
    <h1>Radar Comercial</h1>
    <p>Acceso exclusivo del equipo SOC</p>
    <form id="form-login">
      <p>
        <label for="login-correo">Correo:</label>
        <input type="email" id="login-correo" autocomplete="username" required>
      </p>
      <p>
        <label for="login-clave">Contraseña:</label>
        <input type="password" id="login-clave" autocomplete="current-password" required>
      </p>
      <button type="submit" id="btn-entrar">Entrar</button>
    </form>
    <p id="login-error" role="alert"></p>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <h1>Radar Comercial</h1>
    <p>
      <span id="usuario"></span>
      <button type="button" id="btn-salir">Salir</button>
    </p>
    <p id="menu"></p>
    <hr>

    <!-- Modulo 1: busqueda -->
    <section class="modulo" data-id="busqueda">
      <h2>Búsqueda en Marketplace</h2>
      <p>
        Escribe las palabras clave separadas por coma. La búsqueda tarda varios minutos.
        Si lo dejas vacío se usan las palabras de setup.txt.
      </p>
      <p>
        <input type="text" id="palabras" size="60" maxlength="200"
               placeholder="Ej.: Comex, Vinci, impermeabilizante">
        <button type="button" id="btn-buscar">Buscar</button>
        <button type="button" id="btn-ultimos">Ver últimos resultados</button>
      </p>
      <p id="estado" role="status" aria-live="polite"></p>

      <div id="zona-resultados" hidden>
        <h3>Resultados</h3>
        <p>
          <label>Lugar: <input type="text" id="filtro-lugar"></label>
          <label>Texto: <input type="text" id="filtro-texto"></label>
          <label>Clasificación:
            <select id="filtro-clasificacion">
              <option value="">Todos</option>
              <option value="TP">TP</option>
              <option value="FP">FP</option>
              <option value="sin-clasificar">Sin clasificar</option>
            </select>
          </label>
          <button type="button" id="btn-descargar">Descargar CSV</button>
        </p>

        <table id="tabla-resultados" border="1">
          <thead>
            <tr>
              <th>Enlace</th>
              <th>Publicación</th>
              <th>Fecha</th>
              <th>Lugar</th>
              <th>Clasificación</th>
              <th>Lista</th>
              <th>Notas</th>
            </tr>
          </thead>
          <tbody id="tabla-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Modulos 2 y 3: se generan desde modulos.js -->
    <div id="modulos-extra"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="modulos.js"></script>
  <script src="app.js"></script>
</body>
</html>
